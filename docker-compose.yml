# No `version:` key on purpose: the modern Compose spec (v2 CLI) supports
# `depends_on` with `condition: service_healthy`. Adding `version: 3.x`
# would re-enable the old spec and reject that form.

services:
  app:
    build: .
    # Tag the local build so the one-shot seeder (and prebuilt deploys)
    # can reference the same artifact. Prebuilt deploys: set
    # APP_IMAGE to the published tag and omit --build; no repo needed.
    image: ${APP_IMAGE:-tech-wire:latest}
    container_name: vulnapp
    ports:
      - "8080:80"
    environment:
      MYSQL_HOST: db
      MYSQL_USER: app
      MYSQL_PASS: app_pass
      MYSQL_DB: vulnapp
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot seeder — the ONLY seeding path (no host bind mounts, so
  # prebuilt images work with no repo on the server). Runs db/seed.php
  # from the app image, then exits. Safe to re-run: users/products are
  # upserted, comments seed only into an empty table.
  seed:
    image: ${APP_IMAGE:-tech-wire:latest}
    container_name: vulnapp-seed
    command: ["php", "/var/www/html/db/seed.php"]
    environment:
      MYSQL_HOST: db
      MYSQL_USER: app
      MYSQL_PASS: app_pass
      MYSQL_DB: vulnapp
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: mysql:8.0
    container_name: vulnapp-db
    environment:
      MYSQL_DATABASE: vulnapp
      MYSQL_USER: app
      MYSQL_PASSWORD: app_pass
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    # Root-over-socket ping is the most reliable liveness check
    # (root@localhost always exists; ping needs no grants).
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  dbdata:
